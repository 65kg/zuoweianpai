<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
  <title>手机号输入</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Droid Sans", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Droid Sans Fallback", "Microsoft YaHei", sans-serif;
      background-color: #f5f7fa;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .card-header {
      background-color: #07c160;
      color: white;
      text-align: center;
      padding: 24px;
      font-size: 18px;
      font-weight: 600;
    }

    .card-body {
      padding: 32px 24px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e4e7ed;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .form-control:focus {
      outline: none;
      border-color: #07c160;
      box-shadow: 0 0 0 3px rgba(7, 193, 96, 0.1);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #07c160;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn-submit:hover {
      background-color: #05a853;
    }

    .btn-submit:active {
      background-color: #049448;
    }

    .error-message {
      color: #ff4d4f;
      font-size: 14px;
      margin-top: 8px;
      display: none;
    }

    .success-message {
      color: #52c41a;
      font-size: 14px;
      margin-top: 16px;
      text-align: center;
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        请输入手机号
      </div>
      <div class="card-body">
        <form id="phoneForm">
          <div class="form-group">
            <label for="phone" class="form-label">手机号</label>
            <input type="tel" id="phone" class="form-control" placeholder="请输入11位手机号码" maxlength="11">
            <div class="error-message" id="phoneError">请输入正确的手机号码</div>
          </div>
          <button type="submit" class="btn-submit">提交</button>
          <div class="success-message" id="successMessage">手机号提交成功！</div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  <script>
    $(document).ready(function() {
      $('#phoneForm').submit(function(e) {
        e.preventDefault();
        
        const phone = $('#phone').val().trim();
        const phoneRegex = /^1[3-9]\d{9}$/;
        
        if (!phoneRegex.test(phone)) {
          $('#phoneError').show();
          $('#successMessage').hide();
          return;
        }
        
        $('#phoneError').hide();
        
        // 发送AJAX请求，将手机号发送到后端
        $.ajax("/api/phone", {
          method: "POST",
          contentType: "application/json; charset=utf-8",
          dataType: "json",
          data: JSON.stringify({
            phone: phone
          }),
          success: function(res) {
            if (res && res.code === 0) {
              $('#successMessage').show();
              // 3秒后隐藏成功提示
              setTimeout(function() {
                $('#successMessage').hide();
              }, 3000);
            } else {
              $('#phoneError').text('提交失败，请重试');
              $('#phoneError').show();
            }
          },
          error: function() {
            $('#phoneError').text('网络错误，请重试');
            $('#phoneError').show();
          }
        });
      });
      
      // 输入时隐藏错误提示
      $('#phone').on('input', function() {
        $('#phoneError').hide();
        $('#successMessage').hide();
      });
    });
  </script>
</body>

</html>
