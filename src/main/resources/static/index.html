<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>贾府喜宴 · 宾客查询</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
      background: linear-gradient(180deg, #8B0000 0%, #A01010 30%, #B22222 60%, #C0392B 100%);
      min-height: 100vh;
      color: #3D1C00;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(255,215,0,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(255,215,0,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 40px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header .deco-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .header .deco-line::before,
    .header .deco-line::after {
      content: '';
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #FFD700, transparent);
    }

    .header .diamond {
      color: #FFD700;
      font-size: 12px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #FFD700;
      letter-spacing: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin-bottom: 6px;
    }

    .header .subtitle {
      font-size: 14px;
      color: rgba(255,215,0,0.7);
      letter-spacing: 4px;
    }

    .search-card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(145deg, #FFFEF7, #FFF9E6);
      border-radius: 16px;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.25),
        0 0 0 1px rgba(255,215,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.8);
      overflow: hidden;
      margin-bottom: 24px;
      position: relative;
    }

    .search-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #FFD700, #FFA500, #FF6347, #FFA500, #FFD700);
    }

    .search-card .card-body {
      padding: 28px 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: #8B4513;
      font-size: 15px;
      letter-spacing: 2px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper::before {
      content: '📱';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 2px solid #E8D5B7;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      background: #FFFEFA;
      color: #3D1C00;
      transition: all 0.3s;
    }

    .form-control::placeholder {
      color: #C4A882;
    }

    .form-control:focus {
      outline: none;
      border-color: #D4A017;
      box-shadow: 0 0 0 4px rgba(212,160,23,0.15);
      background: #FFF;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #D4A017, #B8860B, #D4A017);
      color: #FFF;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 6px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(184,134,11,0.4);
      position: relative;
      overflow: hidden;
    }

    .btn-submit::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
      transition: all 0.5s;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #E8B830, #D4A017, #E8B830);
      box-shadow: 0 6px 20px rgba(184,134,11,0.5);
      transform: translateY(-1px);
    }

    .btn-submit:hover::after {
      left: 100%;
    }

    .btn-submit:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(184,134,11,0.4);
    }

    .error-message {
      color: #C0392B;
      font-size: 14px;
      margin-top: 10px;
      display: none;
      text-align: center;
      background: rgba(192,57,43,0.08);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .result-area {
      width: 100%;
      max-width: 440px;
    }

    .result-card {
      background: linear-gradient(145deg, #FFFEF7, #FFF9E6);
      border-radius: 16px;
      box-shadow:
        0 6px 24px rgba(0,0,0,0.2),
        0 0 0 1px rgba(255,215,0,0.2);
      margin-bottom: 16px;
      overflow: hidden;
      position: relative;
    }

    .result-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #FFD700, #FF6347, #FFD700);
    }

    .result-card .card-header {
      background: linear-gradient(135deg, rgba(139,0,0,0.06), rgba(212,160,23,0.06));
      border-bottom: 1px solid rgba(212,160,23,0.2);
      padding: 16px 20px;
      font-weight: 700;
      font-size: 17px;
      color: #8B0000;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .result-card .card-header .name-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8B0000, #B22222);
      color: #FFD700;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .result-card .card-header .phone-text {
      color: #B8860B;
      font-weight: 400;
      font-size: 14px;
      margin-left: auto;
    }

    .result-card .card-body {
      padding: 12px 20px 20px;
    }

    .info-row {
      display: flex;
      padding: 11px 0;
      border-bottom: 1px solid rgba(212,160,23,0.12);
      font-size: 14px;
      align-items: flex-start;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #A0855C;
      width: 85px;
      flex-shrink: 0;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .info-value {
      color: #3D1C00;
      flex: 1;
      word-break: break-all;
    }

    .tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-right: 6px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .tag-yes {
      background: linear-gradient(135deg, rgba(139,0,0,0.08), rgba(212,160,23,0.08));
      color: #8B0000;
      border: 1px solid rgba(139,0,0,0.15);
    }

    .tag-no {
      background: rgba(0,0,0,0.03);
      color: #B0A090;
    }

    .no-result {
      text-align: center;
      color: rgba(255,215,0,0.8);
      padding: 50px 0;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .no-result .icon {
      font-size: 40px;
      margin-bottom: 12px;
      display: block;
    }

    .loading {
      text-align: center;
      padding: 50px 0;
      color: #FFD700;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .loading .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,215,0,0.3);
      border-top-color: #FFD700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: rgba(255,215,0,0.4);
      font-size: 12px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <div class="header">
      <div class="deco-line"><span class="diamond">◆</span></div>
      <h1>贾府喜宴</h1>
      <div class="subtitle">宾客行程查询</div>
      <div class="deco-line"><span class="diamond">◆</span></div>
    </div>

    <div class="search-card">
      <div class="card-body">
        <form id="searchForm">
          <div class="form-group">
            <label for="keyword" class="form-label">手机号 / 姓名</label>
            <div class="input-wrapper">
              <input type="text" id="keyword" class="form-control" placeholder="输入手机号或姓名查询" maxlength="11">
            </div>
          </div>
          <button type="submit" class="btn-submit">查 询</button>
          <div class="error-message" id="errorMessage"></div>
        </form>
      </div>
    </div>

    <div class="result-area" id="resultArea"></div>

    <div class="footer">恭候光临 · 同贺新禧</div>
  </div>

  <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
  <script>
    $(document).ready(function() {
      $('#searchForm').submit(function(e) {
        e.preventDefault();

        const keyword = $('#keyword').val().trim();
        if (!keyword) {
          showError('请输入手机号或姓名');
          return;
        }

        $('#errorMessage').hide();
        $('#resultArea').html('<div class="loading"><div class="spinner"></div><br>正在查询...</div>');

        var params = {};
        if (/^\d+$/.test(keyword)) {
          params.phone = keyword;
        } else {
          params.name = keyword;
        }

        $.ajax({
          url: "/api/reservation/search",
          method: "GET",
          dataType: "json",
          data: params,
          success: function(res) {
            if (res && res.code === 0) {
              renderResults(res.data);
            } else {
              showError('查询失败：' + (res.errorMsg || '未知错误'));
              $('#resultArea').html('');
            }
          },
          error: function() {
            showError('网络错误，请重试');
            $('#resultArea').html('');
          }
        });
      });

      $('#keyword').on('input', function() {
        $('#errorMessage').hide();
      });

      function showError(msg) {
        $('#errorMessage').text(msg).show();
      }

      function renderResults(list) {
        if (!list || list.length === 0) {
          $('#resultArea').html('<div class="no-result"><span class="icon">🏮</span>未查询到相关预订信息</div>');
          return;
        }

        let html = '';
        list.forEach(function(item) {
          const roomTypes = [];
          if (item.roomTypeSingle) roomTypes.push('<span class="tag tag-yes">大床房</span>');
          if (item.roomTypeStandard) roomTypes.push('<span class="tag tag-yes">标准间</span>');
          if (item.roomTypeSuite) roomTypes.push('<span class="tag tag-yes">套房</span>');
          const roomTypeHtml = roomTypes.length > 0 ? roomTypes.join('') : '<span class="tag tag-no">无</span>';

          const initial = (item.name || '').charAt(0);

          html += '<div class="result-card">';
          html += '<div class="card-header">';
          html += '<span class="name-icon">' + initial + '</span>';
          html += (item.name || '');
          html += '<span class="phone-text">' + (item.phone || '') + '</span>';
          html += '</div>';
          html += '<div class="card-body">';
          html += infoRow('来宾人数', item.guestCount);
          html += infoRow('房间需求数', item.roomCount);
          html += infoRow('房间类型', roomTypeHtml);
          html += infoRow('接站地', item.pickupLocation);
          html += infoRow('到达日期', formatDate(item.arrivalDate));
          html += infoRow('到达时间', formatTime(item.arrivalTime));
          html += infoRow('酒店', item.hotel);
          html += infoRow('房间号', item.roomNumber);
          html += infoRow('桌号', item.tableNumber);
          html += infoRow('备注', item.remark);
          html += '</div></div>';
        });

        $('#resultArea').html(html);
      }

      function infoRow(label, value) {
        const display = (value !== null && value !== undefined && value !== '') ? value : '-';
        return '<div class="info-row"><span class="info-label">' + label + '</span><span class="info-value">' + display + '</span></div>';
      }

      function formatDate(dateStr) {
        if (!dateStr) return null;
        return dateStr;
      }

      function formatTime(timeStr) {
        if (!timeStr) return null;
        return timeStr;
      }
    });
  </script>
</body>

</html>
